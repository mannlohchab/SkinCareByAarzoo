upstream skincare_app {
  server app:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name skincarebyaarzoo.com www.skincarebyaarzoo.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://skincarebyaarzoo.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.skincarebyaarzoo.com;

  ssl_certificate /etc/letsencrypt/live/skincarebyaarzoo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skincarebyaarzoo.com/privkey.pem;

  return 301 https://skincarebyaarzoo.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name skincarebyaarzoo.com;

  ssl_certificate /etc/letsencrypt/live/skincarebyaarzoo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skincarebyaarzoo.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location /ws {
    proxy_pass http://skincare_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://skincare_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
